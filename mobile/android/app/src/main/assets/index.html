<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#4d6bfe">
<title>DeepSeekClient 手机端</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--blue:#4d6bfe;--bg:#f7f8fa;--card:#fff;--txt:#1f2329;--muted:#8a919f;--line:#e5e7eb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);height:100vh;display:flex;flex-direction:column}
header{background:var(--blue);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex:none}
header h1{font-size:17px;margin:0;font-weight:600}
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;padding:12px;border:none;background:none;font-size:15px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
main{flex:1;overflow-y:auto;padding:12px}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.muted{color:var(--muted);font-size:13px}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;margin-top:8px}
.btn{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:11px 16px;font-size:15px;cursor:pointer;width:100%;margin-top:10px}
.btn.ghost{background:transparent;color:var(--blue);border:1px solid var(--blue)}
.btn:disabled{opacity:.5}
.msg{padding:10px 12px;border-radius:12px;margin:6px 0;max-width:85%;font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.msg.me{background:var(--blue);color:#fff;margin-left:auto}
.msg.ai{background:var(--card);border:1px solid var(--line);margin-right:auto}
#chatBox{display:flex;flex-direction:column}
.inputbar{display:flex;gap:8px;flex:none;padding:10px 12px;background:var(--card);border-top:1px solid var(--line)}
.inputbar input{flex:1;margin:0;border-radius:20px}
.inputbar button{background:var(--blue);color:#fff;border:none;border-radius:20px;padding:0 18px;font-size:15px;cursor:pointer}
.file{display:flex;align-items:center;justify-content:space-between;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.file .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.file .sz{color:var(--muted);font-size:12px;margin:0 8px}
.file .dir{color:var(--blue);font-size:12px}
.breadcrumb{font-size:13px;color:var(--muted);margin-bottom:8px;word-break:break-all}
a.dl{color:var(--blue);text-decoration:none;font-size:13px}
.spin{text-align:center;color:var(--muted);padding:20px;font-size:13px}
</style>
</head>
<body>
<header><h1>DSH 手机端</h1><span id="connDot" style="font-size:12px;opacity:.85">未连接</span></header>

<!-- 配对页 -->
<div id="pairView" style="flex:1;overflow-y:auto;padding:20px">
  <div class="card">
    <div style="font-size:20px;margin-bottom:10px">🔗 连接电脑</div>
    <div class="muted">电脑端客户端 → 设置 →「手机远程」，查看配对码和地址。</div>
    <input id="server" placeholder="电脑地址，如 192.168.1.100:3191 或 tailscale IP:3191">
    <input id="code" placeholder="6 位配对码" inputmode="numeric" maxlength="6">
    <button class="btn" onclick="doPair()">连接</button>
    <div id="pairMsg" class="muted" style="margin-top:10px"></div>
  </div>
  <div class="card">
    <div style="font-weight:600;margin-bottom:8px">📱 远程能做什么</div>
    <div class="muted" style="line-height:1.8">· 发指令让电脑上的智能体执行（查文件、跑任务）<br>· 浏览电脑文件并下载到手机<br>· 人在外经 Tailscale 组网也能连（免费私密加密）</div>
  </div>
</div>

<!-- 主界面 -->
<div id="mainView" style="display:none;flex:1;flex-direction:column">
  <div class="tabs">
    <button id="tabChat" class="on" onclick="showTab('chat')">💬 指令</button>
    <button id="tabFile" onclick="showTab('file')">📁 文件</button>
  </div>
  <div id="chatView" style="flex:1;display:flex;flex-direction:column">
    <main id="chatBox"></main>
    <div class="inputbar">
      <button onclick="startVoice()" style="background:transparent;color:#4d6bfe;border:none;font-size:22px;cursor:pointer;padding:0 6px" title="语音输入">🎤</button>
      <input id="input" placeholder="给电脑发指令…" onkeydown="if(event.key==='Enter')sendMsg()">
      <button onclick="sendMsg()">发送</button>
    </div>
  </div>
  <div id="fileView" style="flex:1;display:none;flex-direction:column">
    <main>
      <div class="breadcrumb" id="crumb"></div>
      <div id="fileList"></div>
    </main>
  </div>
</div>

<script>
var server='', token='';
var state = { path:'' };
function $(id){return document.getElementById(id)}
function load(){ server = localStorage.getItem('dsh_server')||''; token = localStorage.getItem('dsh_token')||''; if(server && token){ $('server').value=server; showMain(); $('connDot').textContent='已连接'; refreshStatus(); } }
function api(path, data){
  return fetch('http://'+server+path, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(Object.assign({token:token},data||{})) }).then(function(r){ return r.json() });
}
function doPair(){
  server = $('server').value.trim(); var code = $('code').value.trim();
  if(!server||!code){ $('pairMsg').textContent='请填写地址和配对码'; return; }
  fetch('http://'+server+'/api/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code})})
    .then(function(r){return r.json()})
    .then(function(j){
      if(j&&j.ok&&j.token){ token=j.token; localStorage.setItem('dsh_server',server); localStorage.setItem('dsh_token',token); $('pairMsg').textContent=''; showMain(); $('connDot').textContent='已连接'; addAi('已连接电脑，可发送指令或浏览文件。'); }
      else { $('pairMsg').textContent='连接失败：'+(j&&j.error||'未知'); }
    }).catch(function(e){ $('pairMsg').textContent='无法连接：'+e.message });
}
function showMain(){ $('pairView').style.display='none'; $('mainView').style.display='flex'; }
function showTab(t){
  $('tabChat').className = t==='chat'?'on':''; $('tabFile').className = t==='file'?'on':'';
  $('chatView').style.display = t==='chat'?'flex':'none'; $('fileView').style.display = t==='file'?'flex':'none';
  if(t==='file') listDir('');
}
function addMsg(text, cls){ var d=document.createElement('div'); d.className='msg '+cls; d.textContent=text; $('chatBox').appendChild(d); $('chatBox').scrollTop=$('chatBox').scrollHeight; }
function addAi(t){ addMsg(t,'ai') } 
function sendMsg(){ var t=$('input').value.trim(); if(!t) return; addMsg(t,'me'); $('input').value=''; api('/api/chat/send',{text:t}).then(function(j){ if(j&&j.ok){ pollReply(); } else addAi('发送失败：'+(j&&j.error||'')); }); }
function startVoice(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert('当前浏览器不支持语音识别'); return; }
  var rec = new SR();
  rec.lang = 'zh-CN';
  rec.interimResults = false;
  rec.onresult = function(e){ try{ var t=e.results[0][0].transcript; if(t){ $('input').value += t; } }catch(err){} };
  rec.onerror = function(e){ alert('语音识别失败：'+(e.error||'请检查麦克风权限')); };
  try{ rec.start(); }catch(err){ alert('无法启动麦克风，请授权麦克风权限'); }
}
var pollTimer=null;
function pollReply(){ clearInterval(pollTimer); var n=0; pollTimer=setInterval(function(){ api('/api/chat/poll',{}).then(function(j){ if(j&&j.ok&&j.reply){ addAi(j.reply); clearInterval(pollTimer); } else if(++n>60){ clearInterval(pollTimer); } }); },3000); }
function listDir(p){
  state.path = p||'';
  $('crumb').textContent = '📂 '+(state.path||'(默认目录)');
  $('fileList').innerHTML='<div class="spin">加载中…</div>';
  api('/api/files/list',{path:state.path}).then(function(j){
    if(!j||!j.ok){ $('fileList').innerHTML='<div class="muted">'+(j&&j.error||'失败')+'</div>'; return; }
    state.path=j.path||'';
    $('crumb').textContent='📂 '+state.path;
    var html='';
    if(state.path){ html+='<div class="file" onclick="listDir(\''+encodeURIComponent(parentOf(state.path))+'\')"><span class="nm">⬆ 上级目录</span></div>'; }
    (j.entries||[]).forEach(function(e){
      if(e.isDir){ html+='<div class="file" onclick="listDir(\''+encodeURIComponent(e.path)+'\')"><span class="nm">📁 '+esc(e.name)+'</span><span class="dir">目录</span></div>'; }
      else { html+='<div class="file"><span class="nm">📄 '+esc(e.name)+'</span><span class="sz">'+fmt(e.size)+'</span><a class="dl" href="http://'+server+'/api/files/download?token='+token+'&path='+encodeURIComponent(e.path)+'">下载</a></div>'; }
    });
    $('fileList').innerHTML=html||'<div class="muted">空目录</div>';
  });
}
function parentOf(p){ var i=p.lastIndexOf('\\'); if(i<0) i=p.lastIndexOf('/'); return i>0?p.slice(0,i):''; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmt(n){ if(n<1024)return n+' B'; if(n<1048576)return (n/1024).toFixed(1)+' KB'; if(n<1073741824)return (n/1048576).toFixed(1)+' MB'; return (n/1073741824).toFixed(2)+' GB'; }
function refreshStatus(){ api('/api/status',{}).catch(function(){}); }
load();
</script>
</body>
</html>
